# =============================================================================
# lintasJB NMS — konfigurasi reverse proxy untuk aaPanel / Nginx
# Tempel di dalam blok `server { ... }` pada config website aaPanel
# (Website → domain → Config), sebelum blok `location /` bawaan.
# Jika aaPanel sudah membuat `location /`, ganti dengan versi di bawah.
# =============================================================================

# Agar upload logo / import KML-KMZ tidak ditolak Nginx (app membatasi 25 MB).
client_max_body_size 30m;

# SSE realtime — WAJIB tanpa buffering agar alarm & status langsung masuk.
location ^~ /api/events {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    chunked_transfer_encoding off;
}

# Aplikasi utama (SPA + REST API)
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# =============================================================================
# Catatan:
# - Jangan menambahkan header Upgrade/Connection "upgrade"; aplikasi memakai
#   SSE, bukan WebSocket.
# - Ganti 127.0.0.1:8787 bila PORT di .env atau alamat Node berbeda.
# - SSL/HTTPS sebaiknya diatur lewat menu SSL aaPanel (Let's Encrypt),
#   bukan hardcode path sertifikat di sini.
# =============================================================================
